<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Campo de Texto</h1>
    <form action="">
        <label for="pesquisar">Campo De Texto</label>
        <input type="text" id="pesquisar" name="metodo_generico">
        <button type="submit">enviar</button>
    </form>
    <hr>
    <h1>Campo de Email</h1>
    <form action="">
        <label for="email">Campo De Email</label>
        <input type="email" required placeholder="exemplo@email.com" name="email" id="email">
        <button type="submit">enviar</button>
    </form>
    <hr>
        <h1>Campo de senha</h1>
    <form action="">
        <label for="senha">Campo De Senha</label>
        <input type="password" id="senha" name="senha" maxlength="10" minlength="8" required placeholder="digite aqui">
        <button type="submit">enviar</button>
    </form>
    <hr>
    <h1>Campo de Radios</h1>
    <form action="">
        <label for="radios">Campo De Radius</label>
        <input type="radio" id="radios" name="genero" value="masculno" checked>masculino
        <input type="radio" id="radios" name="genero" value="feminino">feminino
        <button type="submit">enviar</button>
    </form>
    <hr>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
</head>
<body>

    <h1>Campo Texto de Area</h1>

    <form>
        <label for="mensagem">Digite sua mensagem:</label>
        <br>

        <textarea 
            id="mensagem"
            name="mensagem"
            rows="5"
            cols="30"
            placeholder="Escreva sua mensagem aqui..."
            style="resize: none;"
        ></textarea>

        <br><br>

        <button type="submit">Enviar</button>

    </form>
    <hr>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Checkbox</title>
</head>
<body>

    <h1>Escolha seus interesses</h1>

    <form>
        <input type="checkbox" id="html" name="interesses" value="HTML">
        <label for="html">HTML</label>

        <br><br>

        <input type="checkbox" id="css" name="interesses" value="CSS">
        <label for="css">CSS</label>

        <br><br>

        <input type="checkbox" id="javascript" name="interesses" value="JavaScript">
        <label for="javascript">JavaScript</label>

        <br><br>

        <button type="submit">Enviar</button>
    </form>

</body>
</html>
