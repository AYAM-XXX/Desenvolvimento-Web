<!DOCTYPE html>

<head>

<body>

    <table>

        <tr>
            <td>dado 5</td>
            <td>dado 6</td>

        <tr>
            <th>Nome</th>

    <h1>Tabela Semanticamente Fazendo Sentido</h1>
    <table border="1">
    <thead>
        <tr>
            <th>Frutas</th>
            <th>Tamanho</th>
            <th>Preço</th>
        </tr>
      </thead>
        <tbody>
            <tr>
                <td>Maça</td>
                <td>G</td>
                <td>10.50</td>
            </tr>
            <tr>
                <td>Uva</td>
                <td>M</td>
                <td>5.50</td>
            </tr>
            <tr>
                <td>Goiaba</td>
                <td>GG</td>
                <td>8.00</td>
            </tr>
        </tbody>
        <tfoot>
            <th>total</th>
            <th colspan="2">24.00</th>
        </tfoot>      
    </table>


  
    
</body>
</html>
